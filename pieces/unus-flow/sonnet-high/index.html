<!DOCTYPE html>
<html lang="la">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unus Flow</title>
<style>
  /* The page is plain black; the artwork is one canvas centred in the window. */
  html,body{margin:0;height:100%;background:#000000;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #stage{position:fixed;left:0;top:0;width:100%;height:100%;}
  canvas{position:absolute;display:block;}
  #fx{pointer-events:none;}               /* the frame-check drawing sits on top, ignores taps */
  #hud{position:fixed;left:8px;top:8px;padding:4px 8px;font:600 14px/1.2 Helvetica,Arial,sans-serif;
    color:#fff;background:rgba(0,0,0,.6);display:none;pointer-events:none;}
  /* The tap buttons are HTML on top of the canvas. They are not part of the artwork. */
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;justify-content:center;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));opacity:0;pointer-events:none;}
  #bar button{flex:1 1 0;max-width:120px;min-height:48px;border:0;border-radius:4px;
    background:rgba(17,17,17,.88);color:#fff;font:600 15px Helvetica,Arial,sans-serif;
    touch-action:manipulation;}
  #bar button.on{background:#e30613;}
</style>
</head>
<body>
<div id="stage"><canvas id="art"></canvas><canvas id="fx"></canvas></div>
<div id="hud"></div>
<div id="bar">
  <button id="bPlay">Pause</button><button id="bPrev">&lsaquo; Beat</button>
  <button id="bNext">Beat &rsaquo;</button><button id="bD">D</button>
  <button id="bM">M</button><button id="bF">F</button>
</div>

<script>
/* =====================================================================
   UNUS FLOW  -  a 16 second seamless loop, 1080 x 1350, 90 BPM.

   How this file is organised (read it top to bottom):
     1. Constants and the grid
     2. Small maths helpers (easing)
     3. Drawing helpers: field, text, rect, circle, tri, path, line.
        Each one DRAWS and RECORDS what it drew, in the same call.
     4. The content: the modules (squares, circles, triangles), the
        words, the rules (lines) and the hi-hat marks
     5. renderFrame(t): draws one frame as a pure function of t
     6. frameCheck(): the built-in checker that tests the rules
     7. Playback, keys, buttons, drum metronome
   Time inside the content code is counted in FRAMES at 60 per second:
   one beat = 40 frames, one bar = 160 frames, the loop = 960 frames.
   ===================================================================== */
(function () {
'use strict';

/* ---------- 1. CONSTANTS AND THE GRID ---------- */
const W = 1080, H = 1350;              // the frame, in "frame pixels"
const FPS = 60, BEAT = 40, BAR = 160, TOTAL = 960;
const MARGIN = 135, CELL = 135;        // 6 columns x 8 rows of 135 px squares
const INSET = 21;                      // every home box is a cell shrunk by 21 px on each side
const LIVE = { x: 135, y: 135, w: 810, h: 1080 };   // the live area inside the margins
const FONT = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const DARK = '#111111', LIGHT = '#ffffff', RED = '#e30613';
const TAU = Math.PI * 2;

const gx = i => MARGIN + CELL * i;     // x of vertical grid line i   (0..6)
const gy = j => MARGIN + CELL * j;     // y of horizontal grid line j (0..8)
// The home box of a block of whole cells: c,r = first cell, w,h = size in cells.
function cellBox(c, r, w, h) {
  return [gx(c) + INSET, gy(r) + INSET, w * CELL - 2 * INSET, h * CELL - 2 * INSET];
}
const cellCx = c => gx(c) + CELL / 2;  // centre of cell column c
const cellCy = r => gy(r) + CELL / 2;  // centre of cell row r

/* ---------- 2. MATHS HELPERS ---------- */
const clamp01 = x => (x < 0 ? 0 : x > 1 ? 1 : x);
const smooth = u => { u = clamp01(u); return u * u * (3 - 2 * u); };                       // gentle S-curve
const smoother = u => { u = clamp01(u); return u * u * u * (u * (u * 6 - 15) + 10); };      // even gentler
const lerp = (a, b, u) => a + (b - a) * u;
// A tiny repeatable "random" number from an integer. No Math.random anywhere.
function hash(n) {
  let x = (n * 2654435761) >>> 0;
  x ^= x >>> 15; x = Math.imul(x, 2246822519) >>> 0; x ^= x >>> 13;
  return (x >>> 0) / 4294967296;
}
// 1 normally, fading to 0 on the last beat (frames 920..960): everything leaves to plain white.
const globalFade = f => 1 - smooth((f - 920) / 40);

/* ---------- 3. DRAWING HELPERS (draw + record) ---------- */
const canvas = document.getElementById('art'), ctx = canvas.getContext('2d');
const fxCanvas = document.getElementById('fx'), fctx = fxCanvas.getContext('2d');
let PX = 1;            // canvas pixels per frame pixel
let DRY = false;       // true while frameCheck steps through time: records only, no painting
let REC = [];          // the records of the frame being drawn
let CUR_STATE = null;  // background state of the frame being drawn

/* The background. Two wipes (a new field slides in from one edge):
   frames 432..480 white->black (finishes on 8.000 s), 752..800 black->white (13.333 s). */
const WIPES = [
  { f0: 432, f1: 480, from: 'W', to: 'K', dir: 'down'  },   // black slides down from the top
  { f0: 752, f1: 800, from: 'K', to: 'W', dir: 'right' }    // white slides in from the left
];
function fieldState(f) {
  let base = 'W', cover = 0;                      // cover = share of the frame that is black
  for (const w of WIPES) {
    if (f < w.f0) break;
    if (f < w.f1) {
      const p = smoother((f - w.f0) / (w.f1 - w.f0));
      return { base, wipe: { dir: w.dir, p, from: w.from, to: w.to }, cover: w.to === 'K' ? p : 1 - p };
    }
    base = w.to; cover = base === 'K' ? 1 : 0;
  }
  return { base, wipe: null, cover };
}
const inkOf = fieldColour => (fieldColour === 'W' ? DARK : LIGHT);   // ink is the opposite of the field

// Work out how to paint something at this place: one colour, or two colours split at the wipe edge.
function passesFor(color, box) {
  if (color === 'red') return [{ clip: null, col: RED }];
  const st = CUR_STATE;
  if (!st.wipe) return [{ clip: null, col: inkOf(st.base) }];
  const { dir, p, from, to } = st.wipe;
  if (dir === 'down') {
    const fy = p * H;
    if (box.y + box.h <= fy) return [{ clip: null, col: inkOf(to) }];
    if (box.y >= fy) return [{ clip: null, col: inkOf(from) }];
    return [{ clip: [0, 0, W, fy], col: inkOf(to) }, { clip: [0, fy, W, H - fy], col: inkOf(from) }];
  }
  const fxp = p * W;
  if (box.x + box.w <= fxp) return [{ clip: null, col: inkOf(to) }];
  if (box.x >= fxp) return [{ clip: null, col: inkOf(from) }];
  return [{ clip: [0, 0, fxp, H], col: inkOf(to) }, { clip: [fxp, 0, W - fxp, H], col: inkOf(from) }];
}
// Paint with fn() in the right colour(s). Returns the colour used (for the record).
function paint(box, color, alpha, fn) {
  const passes = passesFor(color, box);
  if (!DRY) {
    ctx.globalAlpha = alpha;
    for (const ps of passes) {
      ctx.fillStyle = ps.col;
      if (ps.clip) { ctx.save(); ctx.beginPath(); ctx.rect(ps.clip[0], ps.clip[1], ps.clip[2], ps.clip[3]); ctx.clip(); fn(); ctx.restore(); }
      else fn();
    }
    ctx.globalAlpha = 1;
  }
  return passes[0].col;
}
function push(rec, extra) { if (extra) Object.assign(rec, extra); REC.push(rec); }

// field(): the full-frame background. Not a "shape": the checker only looks at its timing.
function field(f) {
  const st = fieldState(f); CUR_STATE = st;
  if (!DRY) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = st.wipe ? (st.wipe.from === 'W' ? LIGHT : DARK) : (st.base === 'W' ? LIGHT : DARK);
    ctx.fillRect(0, 0, W, H);
    if (st.wipe) {
      ctx.fillStyle = st.wipe.to === 'W' ? LIGHT : DARK;
      if (st.wipe.dir === 'down') ctx.fillRect(0, 0, W, st.wipe.p * H);
      else ctx.fillRect(0, 0, st.wipe.p * W, H);
    }
  }
  REC.push({ id: 'field', kind: 'field', x: 0, y: 0, w: W, h: H, alpha: 1, cover: st.cover, mode: st.wipe ? 'wipe' : 'solid' });
}
function rect(id, x, y, w, h, color, alpha, extra) {
  const col = paint({ x, y, w, h }, color, alpha, () => ctx.fillRect(x, y, w, h));
  push({ id, kind: 'rect', x, y, w, h, color: col, logical: color, alpha }, extra);
}
function circle(id, cx, cy, r, color, alpha, extra) {
  const box = { x: cx - r, y: cy - r, w: 2 * r, h: 2 * r };
  const col = paint(box, color, alpha, () => { ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill(); });
  push({ id, kind: 'circle', x: box.x, y: box.y, w: box.w, h: box.h, cx, cy, r, color: col, logical: color, alpha }, extra);
}
function polyDraw(pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fill(); }
function boxOf(pts) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of pts) { if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]; if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
// A triangle is drawn as a path of three corners.
function tri(id, pts, color, alpha, extra) {
  const b = boxOf(pts);
  const col = paint(b, color, alpha, () => polyDraw(pts));
  push({ id, kind: 'tri', x: b.x, y: b.y, w: b.w, h: b.h, pts, color: col, logical: color, alpha }, extra);
}
// Any other closed path (used for the square-to-circle morph).
function path(id, pts, color, alpha, extra) {
  const b = boxOf(pts);
  const col = paint(b, color, alpha, () => polyDraw(pts));
  push({ id, kind: 'path', x: b.x, y: b.y, w: b.w, h: b.h, color: col, logical: color, alpha }, extra);
}
// A straight horizontal or vertical rule with a thickness.
function line(id, x1, y1, x2, y2, th, color, alpha, extra) {
  const b = { x: Math.min(x1, x2) - (x1 === x2 ? th / 2 : 0), y: Math.min(y1, y2) - (y1 === y2 ? th / 2 : 0),
              w: Math.abs(x2 - x1) + (x1 === x2 ? th : 0), h: Math.abs(y2 - y1) + (y1 === y2 ? th : 0) };
  const col = paint(b, color, alpha, () => ctx.fillRect(b.x, b.y, b.w, b.h));
  push({ id, kind: 'line', x: b.x, y: b.y, w: b.w, h: b.h, x1, y1, x2, y2, th, color: col, logical: color, alpha }, extra);
}
// Text is measured with measureText on THIS device, and its box is the real ink box.
const mcache = new Map();
function measure(str, size, weight) {
  const key = weight + '|' + size + '|' + str;
  let m = mcache.get(key);
  if (!m) {
    ctx.font = weight + ' ' + size + 'px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    const t = ctx.measureText(str);
    m = { abl: t.actualBoundingBoxLeft, abr: t.actualBoundingBoxRight, aa: t.actualBoundingBoxAscent, ad: t.actualBoundingBoxDescent };
    mcache.set(key, m);
  }
  return m;
}
// (x,y) is the left end of the baseline.
function text(id, str, x, y, size, weight, color, alpha, extra) {
  const m = measure(str, size, weight);
  const b = { x: x - m.abl, y: y - m.aa, w: m.abl + m.abr, h: m.aa + m.ad };
  const col = paint(b, color, alpha, () => { ctx.font = weight + ' ' + size + 'px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y); });
  push({ id, kind: 'text', x: b.x, y: b.y, w: b.w, h: b.h, text: str, size, weight, color: col, logical: color, alpha }, extra);
}

/* ---------- 4. CONTENT ---------- */

/* 4a. Hi-hat patterns, one per act. Offsets are frames inside each beat (40 frames). */
const HAT_PATTERN = [
  [],                         // act 1: no hi-hat, just kick and snare
  [20],                       // act 2: off-beats
  [0, 20],                    // act 3: 8ths
  [0, 10, 20, 30],            // act 4: 16ths
  [0, 40 / 3, 80 / 3],        // act 5: triplets
  [20]                        // act 6: off-beats
];
const BEAT_EVENTS = [];       // every drum hit of the loop: {f, type}
(function () {
  for (let b = 0; b < 24; b++) {
    const f = b * BEAT, m = b % 4;
    if (m === 0) BEAT_EVENTS.push({ f, type: 'kick' });            // beat 1: kick
    else if (m === 2) BEAT_EVENTS.push({ f, type: 'kick2' });      // beat 3: softer kick
    else BEAT_EVENTS.push({ f, type: 'snare' });                   // beats 2 and 4: snare
    for (const o of HAT_PATTERN[Math.floor(b / 4)]) BEAT_EVENTS.push({ f: f + o, type: 'hat' });
  }
  BEAT_EVENTS.sort((a, b) => a.f - b.f);
})();
const HAT_FRAMES = BEAT_EVENTS.filter(e => e.type === 'hat').map(e => e.f);

/* 4b. Modules: the squares, circles and triangles. Each has a "home" on the grid.
   It grows in, can slide from home to home (an S-curve, landing on a hit),
   breathes inside its home, and shrinks away. */
const MODS = [];
function addMod(kind, ink, c, r, t0, o) {
  const i = MODS.length;
  const m = Object.assign({ id: 'm' + i, kind, ink, t0, g: 24, tv: Infinity, gv: 24, w: 1, h: 1, morph: null }, o || {});
  m.th1 = hash(i * 7 + 1) * TAU; m.th2 = hash(i * 7 + 2) * TAU; m.th3 = hash(i * 7 + 3) * TAU;
  m.ori = Math.floor(hash(i * 7 + 4) * 4);            // which way a triangle points
  m.delay = 5 * c + 2.5 * r;                          // the wave: 5 frames (1/8 beat) per column
  m.stops = [{ f: 0, dur: 0, box: cellBox(c, r, m.w, m.h) }];
  MODS.push(m);
  return m;
}
function slideTo(m, c, r, arrive, dur, w, h) {        // start (arrive-dur), land exactly on "arrive"
  m.stops.push({ f: arrive, dur, box: cellBox(c, r, w || 1, h || 1) });
}
function homeAt(m, f) {
  const S = m.stops;
  let cur = S[0].box, rec = cur;
  for (let i = 1; i < S.length; i++) {
    const st = S[i], start = st.f - st.dur;
    if (f <= start) break;
    if (f >= st.f) { cur = st.box; rec = st.box; continue; }
    const u = smoother((f - start) / st.dur), a = S[i - 1].box, b = st.box;
    cur = [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u), lerp(a[3], b[3], u)];
    rec = u < 0.5 ? a : b;                            // the "home" switches halfway through a move
    break;
  }
  return { box: cur, home: rec };
}
// Breathing size (always a bit under the home size) + the wave: a pulse that passes
// every bar, each module 5 frames after the one to its left.
function scaleOf(m, f) {
  // Near a slide the module stays calm and a little smaller (so it never leaves its home while it
  // starts or ends a move); far from any slide the pulse can be deeper and more visible.
  let dist = 1e9;
  for (let i = 1; i < m.stops.length; i++) {
    const a = m.stops[i].f - m.stops[i].dur, b = m.stops[i].f;
    dist = Math.min(dist, f < a ? a - f : f > b ? f - b : 0);
  }
  const calm = smooth(dist / 24);
  const sine = 0.012 * Math.sin(f * TAU / 200 + m.th1);
  const ph = (((f - m.delay) % BAR) + BAR) % BAR;
  const bump = ph < 80 ? 0.5 * (1 - Math.cos(TAU * ph / 80)) : 0;
  return 0.90 + 0.065 * calm + sine - (0.07 + 0.07 * calm) * bump;
}
function triPts(x, y, w, h, ori) {
  if (ori === 0) return [[x + w / 2, y], [x + w, y + h], [x, y + h]];
  if (ori === 1) return [[x, y], [x + w, y], [x + w / 2, y + h]];
  if (ori === 2) return [[x, y + h / 2], [x + w, y], [x + w, y + h]];
  return [[x + w, y + h / 2], [x, y], [x, y + h]];
}
// A rounded square whose corners grow until it is a circle (k = 0..1). One simple closed shape.
function roundedPts(x, y, w, h, k) {
  const r = k * Math.min(w, h) / 2, pts = [], n = 14;
  const corners = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of corners) for (let i = 0; i <= n; i++) { const a = a0 + (Math.PI / 2) * i / n; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return pts;
}
function drawMod(m, f, ga) {
  const life = smooth((f - m.t0) / m.g) * (1 - smooth((f - m.tv) / m.gv));
  if (life <= 0) return;
  const hm = homeAt(m, f), hb = hm.box, s = scaleOf(m, f);
  const w = hb[2] * s * life, h = hb[3] * s * life;
  if (w < 0.5 || h < 0.5) return;
  const sx = hb[2] * (1 - s) / 2, sy = hb[3] * (1 - s) / 2;       // free room inside the home
  const cx = hb[0] + hb[2] / 2 + 0.4 * sx * Math.sin(f * TAU / 300 + m.th2);   // slow drift
  const cy = hb[1] + hb[3] / 2 + 0.4 * sy * Math.sin(f * TAU / 420 + m.th3);
  const x = cx - w / 2, y = cy - h / 2, col = m.ink === 'r' ? 'red' : 'ink', ex = { home: hm.home };
  if (m.morph) {                                                  // the act 5 morph: square -> circle
    const k = smoother((f - m.morph[0]) / (m.morph[1] - m.morph[0]));
    if (k >= 1) return circle(m.id, cx, cy, Math.min(w, h) / 2, col, ga, ex);
    if (k > 0) return path(m.id, roundedPts(x, y, w, h, k), col, ga, ex);
    return rect(m.id, x, y, w, h, col, ga, ex);
  }
  if (m.kind === 'S') rect(m.id, x, y, w, h, col, ga, ex);
  else if (m.kind === 'C') circle(m.id, cx, cy, Math.min(w, h) / 2, col, ga, ex);
  else tri(m.id, triPts(x, y, w, h, m.ori), col, ga, ex);
}

/* ---- the cast ---- (kind: S square, C circle, T triangle; ink: k ink, r red)
   Rows 0-1 ("top group") and 5-7 ("bottom group") fill the grid, rows 2-4 are the open band
   where the words live in acts 1-2 and where the many gather in act 4. */
// ACT 1: the one red square grows, then slides down the right edge and lands on beat 2.
const R1 = addMod('S', 'r', 5, 5, 0, { g: 36 });
slideTo(R1, 5, 7, 80, 40);
// ACT 5: it grows into the 2x2 block at the bottom right and morphs into a circle (landing on beat 19).
slideTo(R1, 4, 6, 720, 44, 2, 2);
R1.morph = [644, 720];

// ACT 2: the one multiplies. A wave of growth spreads out from the red square (5 frames per step).
const top0 = ['S', 'T', 'C', 'S', 'T', 'S'], top0ink = 'kkkrkk';
const top1 = ['C', 'C', 'T', 'C', 'S', 'T'], top1ink = 'kkkkrk';
const row5 = ['S', 'T', 'C', 'S', 'T', 'C'], row5ink = 'kkkkrk';
const row6 = ['T', 'C', 'S', 'T', 'C', 'S'], row6ink = 'kkkkkk';
const row7 = ['C', 'S', 'T', 'C'];                                  // columns 0..3, column 4 stays open
function appearTime(c, r) {                                         // distance from the red square at (5,7)
  const d = (5 - c) + (7 - r);
  return d <= 7 ? 168 + 5 * d : 330 + 5 * (d - 8);                 // near: act 2, far: act 3
}
const topGroup = [];
for (let c = 0; c < 6; c++) {
  const a = addMod(top0[c], top0ink[c], c, 0, appearTime(c, 0));
  const b = addMod(top1[c], top1ink[c], c, 1, appearTime(c, 1));
  // ACT 4 gather: the rows slide down into the open band. The lower one leads, 5 frames per column.
  slideTo(b, c, 3, 480 + 5 * c, 40);
  slideTo(a, c, 2, 485 + 5 * c, 40);
  // ACT 5: the many shrink away in a wave from the left.
  a.tv = 646 + 4 * c + 0; b.tv = 646 + 4 * c + 8;
  topGroup.push(a, b);
}
for (let c = 0; c < 6; c++) {
  const m5 = addMod(row5[c], row5ink[c], c, 5, appearTime(c, 5));
  slideTo(m5, c, 4, 495 + 5 * c, 36);                               // ACT 4: slides up into the band
  m5.tv = 646 + 4 * c + 16;                                         // ACT 5: leaves
  const m6 = addMod(row6[c], row6ink[c], c, 6, appearTime(c, 6));
  m6.tv = 496 + 5 * (5 - c);                                        // ACT 4: the outer rows shrink away
}
for (let c = 0; c < 4; c++) {
  const m7 = addMod(row7[c], 'k', c, 7, appearTime(c, 7));
  // ACT 3: this row is a little conveyor: one step right landing on beat 9, one step back landing on beat 11.
  // The right-most module goes first, then each one 5 frames later (a wave); on the way back the left-most leads.
  slideTo(m7, c + 1, 7, 320 + 5 * (3 - c), 40);
  slideTo(m7, c, 7, 400 + 5 * c, 40);
  m7.tv = 486 + 5 * (5 - c);
}
// ACT 3 extras: a few cells of the open band fill for a moment, then leave before the gather.
[[3, 2, 'S'], [4, 2, 'C'], [5, 2, 'T'], [3, 3, 'T'], [4, 3, 'S'], [5, 3, 'C']].forEach(([c, r, k], i) => {
  const m = addMod(k, i === 1 ? 'r' : 'k', c, r, 332 + 5 * ((c - 3) + (r - 2)));
  m.tv = 400 + 5 * ((c - 3) + (r - 2));
});
// ACT 6: after the lockup lands, a few modules fade in beside the words (a wave from the right).
addMod('T', 'k', 5, 5, 812);
addMod('C', 'k', 3, 6, 820);
addMod('T', 'k', 2, 7, 828);
addMod('S', 'k', 0, 6, 836, { w: 2, h: 2, g: 28 });

/* 4c. Hi-hat marks: small 16 px marks that blink on the pattern of the current act.
   They sit on cell centres (or a grid crossing) and never move. */
const MARKS = [];
function addMark(kind, ink, x, y, f0, f1, mod, ph) {
  const idx = MARKS.length;
  const ev = HAT_FRAMES.filter(e => e >= f0 && e <= f1);
  MARKS.push({ id: 'k' + idx, kind, ink, x, y, ev: ev.filter((e, i) => i % mod === ph) });

}
// play every drum hit between two frame numbers (wrapping around the loop)
function playBetween(fa, fb) {
  if (!metro) return;
  const hit = (a, b) => { for (const e of BEAT_EVENTS) if (e.f > a && e.f <= b) drum(e.type); };
  if (fb >= fa) hit(fa, fb); else { hit(fa, TOTAL); hit(-1, fb); }
}

// ----- the animation loop -----
let lastF = 0;
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  if (playing) {
    const t = ((anchorT + (now - anchorWall) / 1000) % 16);
    window.seek(t, true);
    const f = t * FPS; playBetween(lastF, f); lastF = f;
  } else if (dirty) { window.seek(curT, true); dirty = false; }
  // the tap buttons: visible for 3 seconds, then fade away (computed from the clock, no CSS transition)
  const age = (now - uiShownAt) / 1000;
  const op = age < 3 ? 1 : age < 3.4 ? 1 - (age - 3) / 0.4 : 0;
  bar.style.opacity = op; bar.style.pointerEvents = op > 0.5 ? 'auto' : 'none';
}
function stepBeat(dir) {                              // jump to the previous / next beat line
  const beat = curT / (2 / 3);
  const nb = (((dir > 0 ? Math.floor(beat + 1e-6) + 1 : Math.ceil(beat - 1e-6) - 1) % 24) + 24) % 24;
  window.seek(nb * 2 / 3);
  lastF = nb * BEAT;
  if (metro) for (const e of BEAT_EVENTS) if (e.f === nb * BEAT && e.type !== 'hat') drum(e.type);
}
function setPlaying(p) {
  playing = p; anchorT = curT; anchorWall = performance.now(); lastF = curT * FPS;
  document.getElementById('bPlay').textContent = p ? 'Pause' : 'Play';
}
function toggleHud() { showHud = !showHud; hud.style.display = showHud ? 'block' : 'none'; document.getElementById('bD').classList.toggle('on', showHud); dirty = true; }
function toggleMetro() { metro = !metro; if (metro) audioReady(); document.getElementById('bM').classList.toggle('on', metro); }
function toggleFx() { showFx = !showFx; document.getElementById('bF').classList.toggle('on', showFx); dirty = true; if (showFx && playing === false) window.seek(curT); }
function showBar() { uiShownAt = performance.now(); }

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); stepBeat(1); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); stepBeat(-1); }
  else if (e.code === 'KeyD') toggleHud();
  else if (e.code === 'KeyM') toggleMetro();
  else if (e.code === 'KeyF') toggleFx();
});
document.getElementById('stage').addEventListener('pointerdown', showBar);
const bind = (id, fn) => document.getElementById(id).addEventListener('click', e => { e.stopPropagation(); showBar(); fn(); });
bind('bPlay', () => setPlaying(!playing)); bind('bPrev', () => stepBeat(-1)); bind('bNext', () => stepBeat(1));
bind('bD', toggleHud); bind('bM', toggleMetro); bind('bF', toggleFx);

// ----- fit the 1080 x 1350 picture to the window, centred, pixel density capped at 2 -----
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight, k = Math.min(vw / W, vh / H);
  const cw = W * k, ch = H * k, dpr = Math.min(window.devicePixelRatio || 1, 2);
  for (const c of [canvas, fxCanvas]) {
    c.style.width = cw + 'px'; c.style.height = ch + 'px';
    c.style.left = (vw - cw) / 2 + 'px'; c.style.top = (vh - ch) / 2 + 'px';
    c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr);
  }
  PX = canvas.width / W;
  dirty = true;
}
window.addEventListener('resize', fit);
fit();
window.seek(0);
requestAnimationFrame(loop);
})();
</script>
