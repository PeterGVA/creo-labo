<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swiss Hero Spot</title>
<style>
  /* The page is pure black. The artwork (a canvas) is scaled to fit and centred. */
  html, body {
    margin: 0;
    height: 100%;
    background: #000000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas { display: block; }

  /* Small overlay showing bar.beat. Toggled with the D key. */
  #hud {
    position: fixed;
    left: 12px;
    top: 12px;
    padding: 4px 10px;
    background: rgba(0, 0, 0, 0.6);
    color: #ffffff;
    font: 700 14px "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: none;
  }
  #hud.on { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud"></div>

<script>
/* =====================================================================
   SWISS HERO SPOT: 16 seconds, 90 BPM, 4/4, 1080 x 1350 portrait.

   The whole picture is drawn by one function, drawAt(t). The number t is
   the time in seconds inside the 16-second loop. The same t always gives
   the same picture. Nothing is random and nothing keeps its own state
   between frames, except the clock that counts time.
   ===================================================================== */


/* ---------- 1. Sizes, timing and colours ---------- */

const W = 1080, H = 1350;                 // the artboard, in pixels
const MARGIN = 60;                        // outer margin on every side
const COLS = 6, ROWS = 8;                 // the grid: 6 columns, 8 rows
const CELL_W = (W - 2 * MARGIN) / COLS;   // 160 px per column
const CELL_H = (H - 2 * MARGIN) / ROWS;   // 153.75 px per row

const BPM = 90;
const BEAT = 60 / BPM;                    // 0.6667 s (one beat)
const HALF = BEAT / 2;                    // 0.3333 s (half a beat)
const BAR = BEAT * 4;                     // 2.6667 s (one bar of 4 beats)
const LOOP = BAR * 6;                     // 16 s (six bars)

const WHITE = '#ffffff';
const BLACK = '#111111';
const RED = '#e30613';
// The serial colour sequence used in Act 5, in this exact order.
const SERIES = ['#e30613', '#ff6a00', '#ffd200', '#00a651', '#0057b8', '#5b2c86'];
const FONT = '"Helvetica Neue", Helvetica, Arial, sans-serif';

// How long before its beat a move starts. "Start slightly before, land on the beat."
const PRE = 0.18;


/* ---------- 2. Small helper functions ---------- */

// Keep a number between 0 and 1.
const clamp01 = x => Math.min(1, Math.max(0, x));

// Fast start, slow finish. Used for quick draw-ins and landings.
const easeOut = x => 1 - Math.pow(1 - x, 3);

// Slow start, slow finish. Used for the slow push at the end.
const easeInOut = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

// Wrap any time into the range 0 to 16, so the loop repeats.
const wrap = t => ((t % LOOP) + LOOP) % LOOP;

// Which bar (0 to 5) is time t in? The +1e-6 stops rounding errors
// from putting a time one bar early.
const barOf = t => Math.floor(t / BAR + 1e-6);

// Which beat inside its bar (0 to 3) is time t in?
const beatInBar = t => Math.floor((t - barOf(t) * BAR) / BEAT + 1e-6);

// Grid positions. colX(i) is the left edge of column i. rowY(j) is the top edge of row j.
const colX = i => MARGIN + i * CELL_W;
const rowY = j => MARGIN + j * CELL_H;

// A damped spring tail: a small wobble that starts at 0 on the beat and
// dies away in about half a second. This gives the "spring" feel.
function wobble(dt, amp) {
  if (dt <= 0) return 0;
  return amp * Math.exp(-dt * 9) * Math.sin(dt * 2 * Math.PI * 5.5);
}

// LANDING: a move that starts PRE seconds before beat time T and arrives
// exactly on T. It returns 0 before the move starts, rises to 1 exactly on
// the beat, and then adds a small damped wobble.
function land(t, T, amp = 0) {
  if (t < T - PRE) return 0;
  if (t < T) return easeOut((t - (T - PRE)) / PRE);
  return 1 + wobble(t - T, amp);
}


/* ---------- 3. Drawing helpers ---------- */

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
let k = 1;   // screen pixels per artboard unit. Set by fit() below.

// Fill the whole artboard with one colour.
function paint(color) {
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, W, H);
}

// Draw a filled rectangle.
function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

// Draw text. The weight is always 700 (bold) or 400 (regular), never anything else.
function type(str, x, y, size, weight, color) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

// How wide a piece of text will be at a given size and weight.
function widthOf(str, size, weight) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  return ctx.measureText(str).width;
}


/* ---------- 4. The six acts ---------- */

// ----- ACT 1 (bar 1, 0.000 to 2.667 s): GRID -----
function actGrid(t) {
  paint(WHITE);

  // Beats 2, 3 and 4 fill black modules. Row r gets its module in column
  // (r x m) mod 6, where m is 1 on beat 2, 2 on beat 3 and 3 on beat 4.
  // It is a multiplication rule, so the pattern is visible and repeatable.
  for (let m = 1; m <= 3; m++) {
    const s = land(t, m * BEAT);                 // 0 to 1 as the module lands on its beat
    if (s <= 0) continue;                        // not started yet
    for (let r = 0; r < ROWS; r++) {
      const c = (r * m) % COLS;
      // The module grows out from the middle of its cell.
      const cx = colX(c) + CELL_W / 2;
      const cy = rowY(r) + CELL_H / 2;
      rect(cx - CELL_W * s / 2, cy - CELL_H * s / 2, CELL_W * s, CELL_H * s, BLACK);
    }
  }

  // Beat 1: the grid lines draw in fast, in the first 0.2 seconds.
  const g = easeOut(clamp01(t / 0.2));
  if (g > 0) {
    ctx.strokeStyle = BLACK;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= COLS; i++) {            // vertical lines
      ctx.moveTo(colX(i), MARGIN);
      ctx.lineTo(colX(i), MARGIN + (H - 2 * MARGIN) * g);
    }
    for (let j = 0; j <= ROWS; j++) {            // horizontal lines
      ctx.moveTo(MARGIN, rowY(j));
      ctx.lineTo(MARGIN + (W - 2 * MARGIN) * g, rowY(j));
    }
    ctx.stroke();
  }
}

// ----- ACT 2 (bar 2, 2.667 to 5.333 s): CIRCLES -----
// The radius where each band starts and ends, measured from the bottom-left
// corner. Band k runs from RINGS[k] to RINGS[k + 1]. Band 0 is the widest,
// so beat 1 gives the biggest hit.
const RINGS = [0, 300, 430, 530, 610];

function actCircles(t) {
  paint(WHITE);

  // Each band lands on its own beat: band 0 on beat 1, band 1 on beat 2, and so on.
  const beatTime = [0, 1, 2, 3].map(n => BAR + n * BEAT);

  // Work out the outer radius of every band that has started by time t.
  // A band grows from its inner edge out to its outer edge as it lands.
  const outer = [];
  for (let n = 0; n < 4; n++) {
    if (t < beatTime[n] - PRE) break;            // this band (and later ones) not started
    outer.push(RINGS[n] + (RINGS[n + 1] - RINGS[n]) * land(t, beatTime[n]));
  }

  // Colour: bands alternate black and white. On beat 4, band 2 turns red.
  const colourOf = n => {
    if (n === 2 && t >= beatTime[3]) return RED;
    return n % 2 === 0 ? BLACK : WHITE;
  };

  // Paint full discs from the OUTERMOST band inwards. Each smaller disc then
  // sits on top of the bigger one, so the result looks like rings.
  for (let n = outer.length - 1; n >= 0; n--) {
    ctx.beginPath();
    ctx.arc(0, H, outer[n], 0, Math.PI * 2);     // centre = bottom-left corner
    ctx.fillStyle = colourOf(n);
    ctx.fill();
  }

  // Thin black edges, so the white bands show up on the white page.
  ctx.strokeStyle = BLACK;
  ctx.lineWidth = 4;
  for (const r of outer) {
    ctx.beginPath();
    ctx.arc(0, H, r, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// ----- ACT 3 (bar 3, 5.333 to 8.000 s): CONTRAST -----
// Black field. Each beat cuts to a new item: a giant R, a giant T, a giant G,
// and then a tiny red square.
function actContrast(t) {
  paint(BLACK);

  const beat = beatInBar(t);                     // 0 = R, 1 = T, 2 = G, 3 = square
  const T = 2 * BAR + beat * BEAT;               // the beat this item was cut in on
  const punch = 1 + wobble(t - T, 0.05);         // a tiny spring as each item lands

  ctx.save();
  if (beat === 0) {
    // R: huge. Pushed past the left and bottom edges of the frame.
    ctx.translate(-300, 1480);
    ctx.scale(punch, punch);
    type('R', 0, 0, 2000, 700, WHITE);
  } else if (beat === 1) {
    // T: even bigger. Its top bar is cut off by the top edge, the stem runs off the bottom,
    // and the bar is wider than the frame on both sides.
    ctx.translate(-130, 1544);
    ctx.scale(punch, punch);
    type('T', 0, 0, 2200, 700, WHITE);
  } else if (beat === 2) {
    // G: big, cut off on the left and at the bottom.
    ctx.translate(-120, 1420);
    ctx.scale(punch, punch);
    type('G', 0, 0, 1250, 700, WHITE);
  }
  ctx.restore();

  if (beat === 3) {
    // The tiny red square, sitting on a grid crossing (column 4, row 6).
    rect(colX(4), rowY(6), 90, 90, RED);
  }
}

// ----- ACT 4 (bar 4, 8.000 to 10.667 s): RHYTHM -----
// The text block is made of repeated lines in two sizes, set flush left.
// "beat" is the beat inside this act where the line lands (0 = beat 1, 1 = beat 2, ...).
const BLOCK = [
  { text: 'RASTER', size: 170, weight: 700, drop: 150, beat: 0 },
  { text: 'RASTER', size: 170, weight: 700, drop: 210, beat: 0 },
  // Eight small lines that alternate TRAME and GRIGLIA.
  // The first four land on beat 2, the last four on beat 4.
  ...['TRAME', 'GRIGLIA', 'TRAME', 'GRIGLIA', 'TRAME', 'GRIGLIA', 'TRAME', 'GRIGLIA']
      .map((s, i) => ({ text: s, size: 52, weight: 400, drop: 60, beat: i < 4 ? 1 : 3 })),
];

// The width and height of the whole text block.
// "drop" is how far down the next line starts.
function blockSize() {
  let w = 0;
  for (const line of BLOCK) w = Math.max(w, widthOf(line.text, line.size, line.weight));
  const h = BLOCK.reduce((sum, line) => sum + line.drop, 0);
  return { w, h };
}

// Draw the text block with its top-left corner at (0, 0).
function drawBlock(t) {
  let y = 0;
  for (const line of BLOCK) {
    // Each line slides in from the left and lands exactly on its beat.
    // Before that, it sits fully off the left edge (x = -W), so it is invisible.
    const landTime = 3 * BAR + line.beat * BEAT;
    const x = -(1 - land(t, landTime)) * W;
    // Cap height is about 0.72 of the font size, so the baseline sits that far below the top.
    type(line.text, x, y + line.size * 0.72, line.size, line.weight, BLACK);
    y += line.drop;
  }
}

function actRhythm(t) {
  paint(WHITE);
  const { w: bw, h: bh } = blockSize();

  // Beat 3 of this bar: the block turns 90 degrees and locks to the grid.
  const turnTime = 3 * BAR + 2 * BEAT;
  const p = land(t, turnTime);                   // 0 at the start, 1 after the turn

  // Where the block's centre is: at the start, and at the grid-locked spot.
  // Start: top-left corner on the grid at (margin, row 1).
  // End: rotated, top-left corner on the grid at (margin, row 2).
  const c0x = MARGIN + bw / 2,       c0y = rowY(1) + bh / 2;
  const c1x = MARGIN + bh / 2,       c1y = rowY(2) + bw / 2;
  const cx = c0x + (c1x - c0x) * p;
  const cy = c0y + (c1y - c0y) * p;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.PI / 2 * p);
  ctx.translate(-bw / 2, -bh / 2);
  drawBlock(t);
  ctx.restore();

  // The thick red rule sweeps in from the left on beat 1 and lands on the beat.
  const sweep = land(t, 3 * BAR);
  rect(-W + W * sweep, rowY(7), W, 40, RED);
}

// ----- ACT 5 (bar 5, 10.667 to 13.333 s): SERIES -----
// A 4 x 4 square of modules. The six colours step through the modules on
// every half-beat, in a strict rotating order.
function actSeries(t) {
  paint(WHITE);
  const A = 4 * BAR;                                 // when this act starts (10.667 s)
  const step = Math.floor((t - A) / HALF + 1e-6);    // half-beats since this act started

  // The square turns 45 degrees on beat 3 and snaps back on beat 4.
  const turn = (Math.PI / 4) * (land(t, A + 2 * BEAT) - land(t, A + 3 * BEAT));

  ctx.save();
  ctx.translate(540, 675);                           // a crossing of the grid, the centre of the page
  ctx.rotate(turn);
  let i = 0;                                         // module number, 0 to 15
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      // Each half-beat, every colour moves on to the next module in reading order.
      const colour = SERIES[((i - step) % 6 + 6) % 6];
      rect(-2 * CELL_W + c * CELL_W, -2 * CELL_H + r * CELL_H, CELL_W, CELL_H, colour);
      i++;
    }
  }
  ctx.restore();
}

// ----- ACT 6 (bar 6, 13.333 to 16.000 s): LOCKUP -----
function actLockup(t) {
  paint(WHITE);
  const A = 5 * BAR;                                 // when this act starts (13.333 s)
  const CLEAR = A + 3 * BEAT;                        // beat 4: everything clears (15.333 s)
  if (t >= CLEAR) return;                            // plain white until the loop restarts

  // Slow push: the whole lockup grows by 3% across the three beats.
  const push = 1 + 0.03 * easeInOut(clamp01((t - A) / (3 * BEAT)));
  ctx.save();
  ctx.translate(540, 675);
  ctx.scale(push, push);
  ctx.translate(-540, -675);

  // RASTER: as wide as the margins allow, black, at the top.
  // The font size is chosen so the word fills the width exactly.
  const big = (W - 2 * MARGIN) / widthOf('RASTER', 100, 700) * 100;
  type('RASTER', MARGIN, MARGIN + 0.72 * big, big, 700, BLACK);

  // On beat 3, TRAME slides in from the left and GRIGLIA from the right.
  // Both land on the grid (row 2 and row 4).
  const slide = land(t, A + 2 * BEAT);
  type('TRAME', MARGIN - (1 - slide) * W, rowY(2) + 0.72 * 150, 150, 700, BLACK);
  type('GRIGLIA', MARGIN + (1 - slide) * W, rowY(4) + 0.72 * 150, 150, 400, BLACK);

  // The caption, flush left, rises into place on beat 3 at the bottom margin.
  type('90 BPM — 4/4 — 16 s', MARGIN, H - MARGIN + (1 - slide) * 200, 30, 400, BLACK);

  // One red rule across the margins, on row 6.
  rect(MARGIN, rowY(6), W - 2 * MARGIN, 36, RED);

  // One red circle, centred on a grid crossing (column 5, row 3).
  // It grows out on beat 2 and lands exactly on it.
  const radius = 160 * land(t, A + BEAT);
  if (radius > 0) {
    ctx.beginPath();
    ctx.arc(colX(5), rowY(3), radius, 0, Math.PI * 2);
    ctx.fillStyle = RED;
    ctx.fill();
  }

  ctx.restore();
}


/* ---------- 5. The one drawing entry point ---------- */

// Draw the picture for time t. This is a pure function of t.
function drawAt(t) {
  ctx.setTransform(k, 0, 0, k, 0, 0);           // from here on, draw in artboard units
  switch (barOf(t)) {
    case 0: actGrid(t); break;
    case 1: actCircles(t); break;
    case 2: actContrast(t); break;
    case 3: actRhythm(t); break;
    case 4: actSeries(t); break;
    default: actLockup(t); break;
  }
}

// Fit the canvas to the window, keep the 1080 x 1350 shape, and centre it.
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const dpr = window.devicePixelRatio || 1;      // sharper on phones with high-density screens
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
  canvas.width = Math.round(W * s * dpr);
  canvas.height = Math.round(H * s * dpr);
  k = canvas.width / W;
}


/* ---------- 6. The clock, seek, keys and metronome ---------- */

let elapsed = 0;       // seconds since the start. Never wraps, so the metronome can count beats.
let paused = false;    // Space toggles this
let lastStamp = null;  // the time of the previous animation frame

// The one public entry point: show the picture at time t.
// Any number works. It is wrapped into the 16-second loop.
window.seek = function (t) {
  elapsed = wrap(Number(t));
  drawAt(elapsed);
  showHud(elapsed);
};

// Show bar.beat in the small overlay (only when it is switched on).
function showHud(t) {
  if (!hud.classList.contains('on')) return;
  hud.textContent = `${barOf(t) + 1}.${beatInBar(t) + 1}   t ${t.toFixed(2)} s`;
}

// Keys: Space pauses, left and right step one beat, M toggles the metronome, D toggles the overlay.
window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    paused = !paused;
  } else if (e.code === 'ArrowRight') {
    e.preventDefault();
    paused = true;
    // Jump to the next beat after the current time.
    elapsed = (Math.floor(elapsed / BEAT + 1e-6) + 1) * BEAT;
  } else if (e.code === 'ArrowLeft') {
    e.preventDefault();
    paused = true;
    // Jump back to the previous beat.
    elapsed = (Math.ceil(elapsed / BEAT - 1e-6) - 1) * BEAT;
  } else if (e.code === 'KeyM') {
    toggleMetronome();
  } else if (e.code === 'KeyD') {
    hud.classList.toggle('on');
  }
});

window.addEventListener('resize', () => {
  fit();
  drawAt(wrap(elapsed));
});

// ----- The metronome (Web Audio) -----
let audioCtx = null;             // made on the first M press, because browsers need a key press first
let metOn = false;
let lastClick = -1;              // index of the last beat that already has a click scheduled
let clock = { audio: 0, t: 0 };  // audio time and show time, recorded at each frame

function toggleMetronome() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  metOn = !metOn;
  lastClick = -1;                // the next beat will be found again in scheduleClicks()
}

// One short click. Beat 1 of each bar (the "accent") is higher and louder.
function click(when, accent) {
  const osc = audioCtx.createOscillator();
  const amp = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.value = accent ? 1800 : 1000;
  amp.gain.setValueAtTime(accent ? 0.9 : 0.4, when);
  amp.gain.exponentialRampToValueAtTime(0.001, when + 0.05);   // fade out fast
  osc.connect(amp);
  amp.connect(audioCtx.destination);
  osc.start(when);
  osc.stop(when + 0.06);
}

// Called every frame. Queues the clicks for beats that are coming up in the next 0.15 s.
function scheduleClicks() {
  if (!metOn || paused) return;
  const first = Math.ceil(clock.t / BEAT - 1e-6);             // first beat at or after now
  // If the clock was jumped (a seek or a step), start counting again from here.
  if (lastClick >= first + 2 || lastClick < first - 1) lastClick = first - 1;
  while ((lastClick + 1) * BEAT < clock.t + 0.15) {
    lastClick++;
    const when = clock.audio + (lastClick * BEAT - clock.t);  // convert show time to audio time
    click(Math.max(when, audioCtx.currentTime), lastClick % 4 === 0);
  }
}


/* ---------- 7. Start ---------- */

// The animation loop. It runs about 60 times a second.
function frame(stamp) {
  // Add the real time that passed since the last frame. Cap it, so a
  // background tab does not make the picture jump ahead.
  if (lastStamp !== null && !paused) elapsed += Math.min((stamp - lastStamp) / 1000, 0.1);
  lastStamp = stamp;

  const t = wrap(elapsed);
  drawAt(t);
  showHud(t);

  clock = { audio: audioCtx ? audioCtx.currentTime : 0, t: elapsed };
  scheduleClicks();
  requestAnimationFrame(frame);
}

fit();
requestAnimationFrame(frame);
</script>
</body>
</html>
